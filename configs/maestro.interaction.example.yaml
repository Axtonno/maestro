version: 2

provider:
  id: ollama
  base_url: http://127.0.0.1:11434
  timeout: 10m
  api_key_env: ""

models:
  embedding: embeddinggemma:latest

workspace:
  id: laravel
  root: ../fixtures/laravel-v1
  framework: laravel

interaction:
  chat:
    model: qwen2.5-coder:7b
    timeout: 5m
    streaming: false
    num_ctx: 4096
    thinking: "false"
    max_file_bytes: 1048576
    max_output_bytes: 1048576
  agent:
    model: qwen3.5:9b
    timeout: 10m
    streaming: true
    num_ctx: 8192
    thinking: default

agent:
  id: agent.reference
  tools:
    - workspace.list
    - workspace.read
    - workspace.search

policy:
  id: policy.local-review
  model: allow
  workspace_inspect: allow
  workspace_mutate: deny

limits:
  duration: 10m
  model_turns: 12
  tool_calls: 24
  tool_calls_per_turn: 4
  plan_steps: 8
  plan_revisions: 2
  tool_result_bytes: 65536
  session_bytes: 1048576
  input_tokens: 32768
  output_tokens: 8192

context:
  retrieval: lexical
  top_k: 2
  max_tokens: 2048
  reserved_tokens: 512
  safety_tokens: 256
