    status: deterministic_pass_live_not_run
    fallback_within_run_allowed: false
  constrained_structured_output:
    status: deterministic_pass_live_not_run
    fallback_within_run_allowed: false
  same_tasks_prompt_model_and_oracles_required: true

state_machine:
  - explicit_mutation_request
  - authoritative_single_file_read
  - untrusted_patch_proposal
  - deterministic_validation
  - full_diff_preview
  - explicit_approval
  - stale_state_check
  - atomic_apply
  - final_diff_and_digest_verification
  - terminal_result

phases:
  - {id: M28-P1, name: threat_model_and_contract_freeze, status: complete}
  - {id: M28-P2, name: deterministic_proposal_compiler, status: complete}
  - {id: M28-P3, name: preview_fingerprint_and_one_shot_approval, status: complete}
  - {id: M28-P4, name: containment_stale_check_and_atomic_apply, status: complete}
  - {id: M28-P5, name: deterministic_positive_and_negative_matrix, status: complete}
  - {id: M28-P6, name: transport_comparison, status: complete_without_live_selection}
  - {id: M28-P7, name: semantic_and_live_qualification, status: complete_not_run_environment_unavailable}
  - {id: M28-P8, name: v0.5.0_candidate_handoff, status: complete_no_handoff}

