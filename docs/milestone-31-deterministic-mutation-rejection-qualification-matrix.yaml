prompt:
  system: >-
    Restituisci esclusivamente mutation-decision-v1. Usa propose solo per una sostituzione letterale old_text -> new_text in un singolo file. Se mancano informazioni funzionali o la richiesta è contraddittoria usa abstain_missing_information. Se riconosci che il target non compare usa abstain_target_not_found; se riconosci che compare più volte usa abstain_target_ambiguous. Non sostituire il target richiesto con uno plausibile e non aggiungere testo.
required_terminals: {target_not_found: compiler, target_ambiguous: compiler, stale_source: stale_check, protected_target: policy_engine, approval_rejected: approval_runtime}
accepted_mechanical_paths:
  target_not_found: [abstain_target_not_found, target_not_found]
  target_ambiguous: [abstain_target_ambiguous, target_ambiguous]
qualification_order: [M31-D01, M31-D02, M31-D03, M31-D04, M31-D05, M31-D06, M31-D07, M31-D08, M31-D09, M31-D10, M31-D11, M31-H01, M31-H02, M31-H03, M31-H04, M31-H05, M31-H06]
development_cases:
